<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>積み上げタイマー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#222;background:#f6f6f6}
*{box-sizing:border-box} body{margin:0;padding:24px}
.app{max-width:900px;margin:auto}
h1{margin:0 0 6px;font-size:30px}.sub{color:#666;margin:0 0 22px}
.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #0000000d}
.mode{display:flex;gap:10px;margin-bottom:18px}.mode button{flex:1;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fafafa;font-size:17px;cursor:pointer}.mode button.active{border:2px solid #222;background:#f0f0f0}
.timer{text-align:center;font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:12px 0 18px}
.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border:0;border-radius:12px;font-size:18px;cursor:pointer}.start{background:#222;color:#fff}.stop{background:#ddd}.stop:disabled{opacity:.45;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f5f5f5;border-radius:14px;padding:15px}.metric b{display:block;font-size:25px;margin-top:5px}
canvas{width:100%;height:280px;border:1px solid #eee;border-radius:12px;background:#fff}
.log{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.log:last-child{border-bottom:0}.small{color:#777;font-size:13px}
.danger{margin-top:14px;border:1px solid #ddd;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}
@media(max-width:600px){body{padding:14px}.timer{font-size:48px}.summary{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <h1>積み上げタイマー</h1>
  <p class="sub">ジャズと登録販売者の「実際にやった時間」を記録します。</p>

  
<div class="card" id="cloudPanel">
  <h2>☁️ Mac・iPad共有</h2>
  <p class="small">SupabaseのAPI URLとPublishable keyを入力すると、記録をクラウド保存できます。Secret keyは入力しないでください。</p>
  <input id="sbUrl" placeholder="API URL" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:9px">
  <input id="sbKey" placeholder="Publishable key" type="password" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:9px">
  <input id="sbEmail" placeholder="Supabaseに登録したメールアドレス" type="email" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:9px">
  <input id="sbPassword" placeholder="Supabaseで設定したパスワード" type="password" style="width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:9px">
  <div style="display:flex;gap:8px;margin-top:8px">
    <button id="sbConnect" style="flex:1;padding:11px;border:0;border-radius:9px;background:#222;color:#fff">保存してログイン</button>
    <button id="sbLogout" style="padding:11px;border:1px solid #ccc;border-radius:9px;background:#fff">ログアウト</button>
  </div>
  <div id="sbStatus" class="small" style="margin-top:9px">☁️ 未接続</div>
</div>

<div class="card">
    <div class="mode">
      <button id="jazz" class="active">🎹 ジャズ</button>
      <button id="seller">📚 登録販売者</button>
    </div>
    <div id="timer" class="timer">00:00:00</div>
    <div class="actions">
      <button id="start" class="start">▶ START</button>
      <button id="stop" class="stop" disabled>⏹ STOPして記録</button>
    </div>
    <p class="small">STARTからSTOPまでの経過時間を記録します。ページを閉じても記録は残ります。</p>
  </div>

  <div class="card">
    <h2>今日の積み上げ</h2>
    <div class="summary">
      <div class="metric">🎹 ジャズ<b id="todayJazz">0分</b></div>
      <div class="metric">📚 登録販売者<b id="todaySeller">0分</b></div>
      <div class="metric">合計<b id="todayTotal">0分</b></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0">推移</h2>
      <div class="mode" style="margin:0">
        <button id="seven" class="active">過去7日間</button>
        <button id="week">今週</button>
        <button id="month">今月</button>
      </div>
    </div>
    <canvas id="chart" width="840" height="280"></canvas>
  </div>

  <div class="card">
    <h2>最近の記録</h2>
    <div id="logs"></div>
    <button id="clear" class="danger">すべての記録を削除</button>
  </div>
</div>

<script>
const KEY="stackTimerLogsV1";
let logs=JSON.parse(localStorage.getItem(KEY)||"[]");
let category="jazz", running=false, startedAt=0, tick=null, chartRange="7";

const $=id=>document.getElementById(id);
function fmt(sec){
  sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return [h,m,s].map((v,i)=>i===0?String(v).padStart(2,"0"):String(v).padStart(2,"0")).join(":");
}
function minutes(sec){
  sec=Math.round(sec/60);
  if(sec<60) return sec+"分";
  const h=Math.floor(sec/60),m=sec%60; return h+"時間"+(m?m+"分":"");
}
function dateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function save(){localStorage.setItem(KEY,JSON.stringify(logs));}
function today(cat){
  const k=dateKey();
  return logs.filter(x=>(x.date||x.practice_date)===k&&x.category===cat)
             .reduce((a,x)=>a+x.seconds,0);
}
function render(){
  $("todayJazz").textContent=minutes(today("jazz"));
  $("todaySeller").textContent=minutes(today("seller"));
  $("todayTotal").textContent=minutes(today("jazz")+today("seller"));
  const recent=[...logs].reverse().slice(0,20);
  $("logs").innerHTML=recent.length?recent.map(x=>{
    const d=x.date||x.practice_date||"";
    const t=x.time||"";
    return `<div class="log"><div><b>${x.category==="jazz"?"🎹 ジャズ":"📚 登録販売者"}</b><div class="small">${d} ${t}</div></div>
    <b>${fmt(x.seconds)}</b></div>`;
  }).join(""):"<p class='small'>まだ記録がありません。</p>";
  drawChart();
}
function updateTimer(){
  $("timer").textContent=fmt(running?(Date.now()-startedAt)/1000:0);
}
$("jazz").onclick=()=>{if(!running){category="jazz";$("jazz").classList.add("active");$("seller").classList.remove("active")}};
$("seller").onclick=()=>{if(!running){category="seller";$("seller").classList.add("active");$("jazz").classList.remove("active")}};
$("start").onclick=()=>{if(!sbUser){alert("先にSupabaseへログインしてください。");return;}
  if(running)return; running=true; startedAt=Date.now(); tick=setInterval(updateTimer,250);
  $("start").disabled=true;$("stop").disabled=false;$("jazz").disabled=true;$("seller").disabled=true;
};
$("stop").onclick=async ()=>{
  if(!running)return;
  const seconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));
  running=false;
  clearInterval(tick);tick=null;
  $("timer").textContent="00:00:00";
  $("start").disabled=false;
  $("stop").disabled=true;
  $("jazz").disabled=false;
  $("seller").disabled=false;
  await cloudRecord(seconds);
};
$("clear").onclick=()=>{if(confirm("すべての記録を削除します。よろしいですか？")){logs=[];save();render()}};

function startOfWeek(d){
  const x=new Date(d); const day=x.getDay(); // 日曜=0
  x.setDate(x.getDate()-(day===0?6:day-1)); x.setHours(0,0,0,0); return x;
}
function endOfMonth(d){ const x=new Date(d.getFullYear(),d.getMonth()+1,0); x.setHours(0,0,0,0); return x; }
function keyFromDate(d){ return dateKey(d); }

function drawChart(){
  const c=$("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);

  const now=new Date(), days=[];
  let labels=[];
  if(chartRange==="7"){
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d);labels.push(`${d.getMonth()+1}/${d.getDate()}`);}
  } else if(chartRange==="week"){
    const s=startOfWeek(now);
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);days.push(d);labels.push(["月","火","水","木","金","土","日"][i]);}
  } else {
    const count=endOfMonth(now).getDate();
    for(let i=1;i<=count;i++){days.push(new Date(now.getFullYear(),now.getMonth(),i));labels.push(i+"日");}
  }

  const data=days.map(d=>{
    const k=keyFromDate(d);
    return {
      jazz:logs.filter(x=>(x.date||x.practice_date)===k&&x.category==="jazz").reduce((a,x)=>a+x.seconds,0)/60,
      seller:logs.filter(x=>(x.date||x.practice_date)===k&&x.category==="seller").reduce((a,x)=>a+x.seconds,0)/60
    };
  });

  const max=Math.max(30,...data.map(x=>x.jazz+x.seller)); 
  const left=45,bottom=35,top=20,right=15;
  ctx.strokeStyle="#ddd";ctx.fillStyle="#666";ctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";
  for(let i=0;i<=4;i++){
    const y=top+(h-top-bottom)*i/4,val=Math.round(max*(1-i/4));
    ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillText(val+"分",5,y+4);
  }

  const xstep=data.length===1?0:(w-left-right)/(data.length-1);
  data.forEach((v,i)=>{
    const x=left+i*xstep,total=v.jazz+v.seller;
    const y=top+(h-top-bottom)*(1-total/max);
    if(i>0){
      const pv=data[i-1].jazz+data[i-1].seller,py=top+(h-top-bottom)*(1-pv/max);
      ctx.beginPath();ctx.moveTo(x-xstep,py);ctx.lineTo(x,y);ctx.stroke();
    }
    ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
    if(chartRange!=="month" || i%3===0 || i===data.length-1) ctx.fillText(labels[i],x-12,h-10);
  });
  ctx.fillText("合計時間（分）",left,14);
}

function setChartRange(r){
  chartRange=r;
  ["seven","week","month"].forEach(id=>$(id).classList.remove("active"));
  $(r==="7"?"seven":r).classList.add("active");
  drawChart();
}
$("seven").onclick=()=>setChartRange("7");
$("week").onclick=()=>setChartRange("week");
$("month").onclick=()=>setChartRange("month");
render();


const SB_CFG="tsumikaeSBv1";
let sb=null, sbUser=null;

function sbMsg(t){
  const e=document.getElementById("sbStatus");
  if(e)e.textContent=t;
}

function normalizeCloudRow(x){
  const d=x.practice_date || (x.created_at ? new Date(x.created_at).toISOString().slice(0,10) : dateKey());
  let time=x.time;
  if(!time && x.created_at){
    const dt=new Date(x.created_at);
    time=dt.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  }
  return {...x,date:d,time:time||""};
}

function sbInit(){
  const c=JSON.parse(localStorage.getItem(SB_CFG)||"null");
  if(!c){sbMsg("☁️ 未接続");return;}
  document.getElementById("sbUrl").value=c.url;
  document.getElementById("sbKey").value=c.key;
  sb=window.supabase.createClient(c.url,c.key);
  sbMsg("☁️ 接続設定済み。ログインしてください。");
}

async function sbConnect(){
  const url=document.getElementById("sbUrl").value.trim().replace(/\/$/,"");
  const key=document.getElementById("sbKey").value.trim();
  const email=document.getElementById("sbEmail").value.trim();
  const pw=document.getElementById("sbPassword").value;
  if(!url||!key||!email||!pw){
    sbMsg("URL、Publishable key、メール、パスワードを入力してください。");
    return;
  }
  localStorage.setItem(SB_CFG,JSON.stringify({url,key}));
  sb=window.supabase.createClient(url,key);
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){sbMsg("ログイン失敗："+error.message);return}
  sbUser=data.user;
  sbMsg("☁️ ログイン済み。記録を読み込み中…");
  await cloudLoad();
}

async function sbLogout(){
  if(sb)await sb.auth.signOut();
  sbUser=null;
  logs=[];
  save();
  sbMsg("☁️ ログアウトしました。");
  render();
}

async function cloudLoad(){
  if(!sbUser)return;
  const {data,error}=await sb
    .from("practice_logs")
    .select("id,created_at,practice_date,category,seconds")
    .order("created_at",{ascending:true});
  if(error){sbMsg("読み込み失敗："+error.message);return}
  logs=(data||[]).map(normalizeCloudRow);
  save();
  sbMsg("☁️ 同期済み");
  render();
}

async function cloudRecord(sec){
  if(!sbUser){
    alert("先にSupabaseへログインしてください。");
    return;
  }

  const row={
    user_id:sbUser.id,
    practice_date:dateKey(),
    category,
    seconds:sec
  };

  const {data,error}=await sb
    .from("practice_logs")
    .insert(row)
    .select("id,created_at,practice_date,category,seconds")
    .single();

  if(error){
    alert("クラウド保存に失敗しました："+error.message);
    return;
  }

  logs.push(normalizeCloudRow(data));
  save();
  render();
  sbMsg("☁️ 保存・同期しました");
}

document.getElementById("sbConnect").onclick=sbConnect;
document.getElementById("sbLogout").onclick=sbLogout;
sbInit();

</script>
</body>
</html>
